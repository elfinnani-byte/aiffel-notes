<svg role="img" aria-label="Aider의 search와 replace 블록이 변경 제안으로 이어지는 흐름" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="260" fill="#f8fafc"></rect><text x="380" y="34" text-anchor="middle" font-size="24" fill="#0f172a">Aider 편집 포맷</text><rect x="35" y="76" width="205" height="132" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"></rect><text x="138" y="112" text-anchor="middle" font-size="20" fill="#0f172a">지정한 파일과 요청</text><text x="138" y="146" text-anchor="middle" font-size="18" fill="#475569">찾을 내용</text><text x="138" y="177" text-anchor="middle" font-size="18" fill="#475569">현재 문맥</text><path d="M240 142H306" stroke="#475569" stroke-width="2"></path><path d="M299 136l12 6-12 6" fill="#475569"></path><rect x="316" y="66" width="190" height="152" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"></rect><text x="411" y="103" text-anchor="middle" font-size="20" fill="#0f172a">편집 블록</text><text x="411" y="143" text-anchor="middle" font-size="19" fill="#475569">search</text><text x="411" y="179" text-anchor="middle" font-size="19" fill="#475569">replace</text><path d="M506 142H572" stroke="#475569" stroke-width="2"></path><path d="M565 136l12 6-12 6" fill="#475569"></path><rect x="582" y="86" width="143" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"></rect><text x="654" y="125" text-anchor="middle" font-size="20" fill="#0f172a">변경 제안</text><text x="654" y="156" text-anchor="middle" font-size="18" fill="#475569">검토 뒤 반영</text><text x="380" y="247" text-anchor="middle" font-size="17" fill="#475569">일치 여부와 실제 반영 범위는 변경 이력과 실행 기록으로 확인합니다.</text></svg>
