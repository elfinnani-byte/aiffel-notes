<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wikiskill-title wikiskill-desc" viewBox="0 0 640 480" style="display: block; width: 100%; min-width: 480px; max-width: 640px; height: auto; font-family: Arial, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif;">
<title id="wikiskill-title">실행 경험, 영속 지식 기반, 실행 가능한 스킬의 순환 구조</title>
<desc id="wikiskill-desc">스킬은 한 번 쓰고 버리는 지시가 아니라 축적되는 지식이다. 실행 경험이 기록·정리되어 영속 지식 기반(위키)에 쌓이고, 그 지식이 다음 스킬 갱신의 재료가 되어 실행 가능한 스킬을 만들며, 그 스킬이 다시 실행에 쓰인다. 세 요소를 분리해 관리하는 것이 WikiSkill 프레임의 핵심이다.</desc>
<defs>
<marker id="wikiskill-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"></path>
</marker>
</defs>
<rect x="1" y="1" width="638" height="478" rx="20" fill="#ffffff" stroke="#cbd5e1"></rect>
<text x="320" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">스킬은 한 번 쓰고 버리는 지시가 아니라 축적되는 지식이다</text>
<rect x="260" y="66" width="120" height="56" rx="12" fill="#eff6ff" stroke="#2563eb"></rect>
<text x="320" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">실행 경험</text>
<rect x="70" y="270" width="200" height="56" rx="12" fill="#f0fdfa" stroke="#0f766e"></rect>
<text x="170" y="304" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">영속 지식 기반 (위키)</text>
<rect x="410" y="270" width="180" height="56" rx="12" fill="#faf5ff" stroke="#9333ea"></rect>
<text x="500" y="304" text-anchor="middle" font-size="18" font-weight="700" fill="#7e22ce">실행 가능한 스킬</text>
<path d="M 280 122 C 240 170, 200 210, 190 268" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#wikiskill-arrow)"></path>
<text x="180" y="200" text-anchor="middle" font-size="14" fill="#334155">기록·정리되어 쌓인다</text>
<path d="M 272 300 C 330 300, 350 300, 408 298" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#wikiskill-arrow)"></path>
<text x="340" y="282" text-anchor="middle" font-size="14" fill="#334155">다음 스킬 갱신의 재료가 된다</text>
<path d="M 460 268 C 440 200, 400 150, 360 122" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#wikiskill-arrow)"></path>
<text x="470" y="200" text-anchor="middle" font-size="14" fill="#334155">다시 실행에 쓰인다</text>
<rect x="140" y="400" width="360" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8"></rect>
<text x="320" y="424" text-anchor="middle" font-size="15" fill="#334155">세 요소를 분리해 관리하는 것이</text>
<text x="320" y="446" text-anchor="middle" font-size="15" fill="#334155">WikiSkill 프레임의 핵심</text>
</svg>
