<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="1" y="1" width="898" height="318" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="30" y="38" fill="#0f172a" font-size="20" font-weight="700">정렬 순서는 카메라가 움직일 때마다 다시 정해집니다</text>
  <text x="30" y="60" fill="#475569" font-size="13">같은 알갱이 셋인데 카메라가 놓인 곳이 바뀌면 그리는 차례가 통째로 뒤집힙니다.</text>

  <!-- left panel -->
  <rect x="50" y="90" width="370" height="190" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="235" y="82" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="700">카메라가 왼쪽에 있을 때</text>
  <text x="90" y="230" fill="#475569" font-size="20">📷</text>
  <text x="90" y="255" fill="#475569" font-size="11">카메라</text>

  <circle cx="200" cy="150" r="20" fill="#0891b2"/>
  <circle cx="290" cy="190" r="20" fill="#7c3aed"/>
  <circle cx="380" cy="230" r="20" fill="#2563eb"/>
  <text x="200" y="118" text-anchor="middle" fill="#475569" font-size="11">가깝다</text>
  <text x="380" y="266" text-anchor="middle" fill="#475569" font-size="11">멀다</text>
  <text x="235" y="270" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="700">청록 → 보라 → 파랑 순으로 바릅니다</text>

  <!-- right panel -->
  <rect x="480" y="90" width="370" height="190" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="665" y="82" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="700">카메라가 오른쪽으로 돌면</text>
  <text x="810" y="230" fill="#475569" font-size="20">📷</text>
  <text x="795" y="255" fill="#475569" font-size="11">카메라</text>

  <circle cx="520" cy="230" r="20" fill="#0891b2"/>
  <circle cx="610" cy="190" r="20" fill="#7c3aed"/>
  <circle cx="700" cy="150" r="20" fill="#2563eb"/>
  <text x="520" y="266" text-anchor="middle" fill="#475569" font-size="11">멀다</text>
  <text x="700" y="118" text-anchor="middle" fill="#475569" font-size="11">가깝다</text>
  <text x="665" y="270" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="700">파랑 → 보라 → 청록 순으로 바릅니다</text>

  <line x1="435" y1="185" x2="465" y2="185" stroke="#dc2626" stroke-width="2" marker-end="url(#arr5c)"/>
  <defs>
    <marker id="arr5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="450" y="305" text-anchor="middle" fill="#0f172a" font-size="13">이 줄 세우기가 어긋나면 뒤에 있어야 할 알갱이가 앞을 덮습니다.</text>
</svg>
